services:
  nginx:
    image: nginx:alpine
    container_name: baseplate-nginx
    ports:
      - "${NGINX_PORT:-9083}:80"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    depends_on:
      - baseplate-php

  baseplate-php:
    build: ./docker
    container_name: baseplate-php
    restart: always
    user: "1000:1000"
    expose:
      - "${PHP_PORT:-9000}"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./docker/php.ini:/usr/local/etc/php/php.ini
      - .:/var/www/html
    depends_on:
      - baseplate-redis

  baseplate-redis:
    image: redis:alpine
    container_name: baseplate-redis
    restart: always
    ports:
      - "6079:6379"
    command: redis-server

volumes:
  redis_data:
