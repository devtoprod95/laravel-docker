services:
  nginx:
    image: nginx:alpine
    container_name: baseplate-nginx
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/nginx-entrypoint.sh"]
    ports:
      - "${NGINX_PORT:-9083}:8080"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./docker/nginx-entrypoint.sh:/usr/local/bin/nginx-entrypoint.sh:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    depends_on:
      baseplate-php:
        condition: service_started
    networks:
      - baseplate-network

  baseplate-php:
    build: ./docker
    container_name: baseplate-php
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    expose:
      - "${PHP_PORT:-9000}"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./docker/php.ini:/usr/local/etc/php/php.ini
      - ./docker/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf
      - .:/var/www/html
    depends_on:
      baseplate-redis:
        condition: service_healthy
    networks:
      - baseplate-network

  baseplate-redis:
    image: redis:alpine
    container_name: baseplate-redis
    restart: unless-stopped
    ports:
      - "6079:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - baseplate-network

volumes:
  redis_data:

networks:
  baseplate-network:
    driver: bridge

