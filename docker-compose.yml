services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "${NGINX_PORT:-9083}:80"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    depends_on:
      - php83

  php83:
    build: ./docker
    container_name: php83
    restart: always
    expose:
      - "${PHP_PORT:-9000}"
    environment:
      - TZ=Asia/Seoul
      - REDIS_HOST=phpredis
      - REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - ./docker/php.ini:/usr/local/etc/php/php.ini
      - .:/var/www/html
    depends_on:
      - phpredis

  phpredis:
    image: redis:alpine
    container_name: phpredis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
